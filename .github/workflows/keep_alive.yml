name: Keep Bot Awake 24/7

on:
  schedule:
    # Runs automatically every 10 minutes in the cloud, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual test run button

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Bot Service
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://btc-option-otm2-4.onrender.com/
